name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC — weekly drift scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # zizmor: artipacked

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck (version pinned in .github/security-tools)
        working-directory: .github/security-tools
        run: go install golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # zizmor: artipacked

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec (version pinned in .github/security-tools)
        working-directory: .github/security-tools
        run: go install github.com/securego/gosec/v2/cmd/gosec

      - name: Run gosec
        run: gosec -severity=medium -confidence=medium ./...

  zizmor:
    name: zizmor (GH Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload SARIF results to code-scanning
      actions: read # zizmor-action probes the calling workflow_run via the Actions API
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # zizmor: artipacked

      - name: Run zizmor
        # action.yml defaults `token: ${{ github.token }}` and
        # `online-audits: true`, so impostor-commit gets authenticated GitHub
        # API access (5000 req/h) automatically — no `env:` override needed.
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
