name: verify-labels

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: at-least-one release-drafter label
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@1e35e4fdc6f29832b20ce3e62d85164c32a16a21
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
      - name: Check for category label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # Categories must match .github/release-drafter.yml exactly.
          required="breaking major feature enhancement fix bug security chore refactor test ci docs deps dependencies"
          got="$(printf '%s' "$LABELS" | tr -d '[]" ' | tr ',' ' ')"
          for label in $got; do
            for r in $required; do
              if [ "$label" = "$r" ]; then
                echo "OK: PR has release-drafter category label '$label'"
                exit 0
              fi
            done
          done
          echo "::error::PR must carry at least one of: $required"
          exit 1
