name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: build & publish GitHub Release
    runs-on: ubuntu-latest
    # go-duckdb (via tailpipe-plugin-sdk) needs CGO; this image ships the C
    # cross compilers .goreleaser.yml references. Keep its Go version in step
    # with the go.mod toolchain directive.
    container:
      image: goreleaser/goreleaser-cross:v1.27.3-v2.18.3@sha256:1820cee53c4c06cfb43c2203caca73f9497042f5b6061c8916a251228a321975
    permissions:
      contents: write # create GitHub Release + upload archives
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog
          persist-credentials: false # zizmor: artipacked
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@3a99261dae897b6a73b2d04d88cfc832a8f18f4b
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true

      # Go and goreleaser both come from the container image.
      - name: Run goreleaser
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
