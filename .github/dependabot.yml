version: 2

# 7-day cooldown across all ecosystems so version bumps land in batches rather
# than as a daily stream. Adjust if a high-severity advisory needs faster
# turnaround.

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Group minor + patch bumps so they land as batched PRs. Major bumps are
    # deliberately left out of every group so each arrives as its own PR for
    # individual review.
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
        update-types:
          - "minor"
          - "patch"
      tailpipe-sdk:
        patterns:
          - "github.com/turbot/tailpipe-plugin-sdk"
          - "github.com/turbot/pipe-fittings/*"
          - "github.com/turbot/go-kit"
        update-types:
          - "minor"
          - "patch"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
        update-types:
          - "minor"
          - "patch"
      gcp:
        patterns:
          - "cloud.google.com/*"
          - "google.golang.org/*"
        update-types:
          - "minor"
          - "patch"
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/turbot/*"
          - "go.opentelemetry.io/*"
          - "cloud.google.com/*"
          - "google.golang.org/*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Security-tooling deps (gosec, govulncheck) live in their own go.mod so
  # they don't perturb the main module graph. Get the same cooldown + label
  # treatment as the main deps.
  - package-ecosystem: "gomod"
    directory: "/.github/security-tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(sec)"
    groups:
      security-tools:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
