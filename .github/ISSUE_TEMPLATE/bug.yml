name: 🐛 Bug report
description: Something is wrong with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please sanitise any FDR data (cids, aids, IPs, MACs, hostnames, usernames, emails) before pasting samples.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Output of `tailpipe plugin list | grep crowdstrike` or the tag of your local build.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: tailpipe-version
    attributes:
      label: Tailpipe CLI version
      description: Output of `tailpipe --version`.
      placeholder: "v0.7.3"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version (if building from source)
      description: Output of `go version`.
      placeholder: "go1.26.3 darwin/arm64"

  - type: dropdown
    id: source
    attributes:
      label: Source type
      multiple: false
      options:
        - crowdstrike_s3_bucket (remote)
        - file (local replay)
        - Both / not sure
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      placeholder: |
        Describe the actual behaviour. Include the `tailpipe collect`/`tailpipe query` command and any error output (sanitised).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        Minimal `.tpc` config (with secrets / bucket name redacted) + the steps to reproduce. If a specific FDR record shape is involved, paste a sanitised one-liner.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Plugin logs
      description: Run with `TAILPIPE_LOG_LEVEL=DEBUG` and paste the relevant section. Sanitise before pasting.
      render: shell
