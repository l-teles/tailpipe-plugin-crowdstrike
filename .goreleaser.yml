# Goreleaser configuration for tailpipe-plugin-crowdstrike.
#
# Shape mirrors turbot/tailpipe-plugin-aws (gz archives, one binary per target,
# binary name ends in `.plugin`). tailpipe-plugin-sdk links go-duckdb, which
# needs CGO, so each target enables it and sets a C cross compiler. Those
# compilers only exist in the goreleaser-cross image, where release.yml (and
# the Tailpipe Hub) run this.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tailpipe-darwin-amd64
    binary: "{{ .ProjectName }}.plugin"
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    flags:
      - -tags=netgo
      - -trimpath # strip absolute paths from the binary for reproducibility
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: tailpipe-darwin-arm64
    binary: "{{ .ProjectName }}.plugin"
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    flags:
      - -tags=netgo
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: tailpipe-linux-arm64
    binary: "{{ .ProjectName }}.plugin"
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    flags:
      - -tags=netgo
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: tailpipe-linux-amd64
    binary: "{{ .ProjectName }}.plugin"
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    flags:
      - -tags=netgo
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Tailpipe install paths expect the binary inside a flat .gz, not a tar.
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Release notes come from Release Drafter (.github/release-drafter.yml).
  disable: true

release:
  draft: true # require a human to flip the release public — defence-in-depth
  prerelease: auto
  mode: replace
