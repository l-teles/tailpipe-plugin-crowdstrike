# pre-commit hooks. Install with `pre-commit install --install-hooks`.
# Keep this in sync with .github/workflows/*.yml — anything CI runs that can
# be reproduced locally should be here too.

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # allow GitHub Actions custom YAML tags
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-dependabot

  # Local hooks delegate to system tools so the same versions run here and in CI.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true

      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --fix
        language: system
        types: [go]
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push] # heavier; only on push, not on every commit

      - id: gosec
        name: gosec
        entry: gosec -quiet -severity=medium -confidence=medium ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
